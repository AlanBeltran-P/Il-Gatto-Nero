<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Il Gatto Nero · Menú</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Menú de Il Gatto Nero, pizzeria y cucina italiana." />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- iOS: que no convierta los precios ($ 32.000) en links de teléfono -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Android e iOS: "Agregar a la pantalla de inicio" abre como app, con barra negra -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Il Gatto Nero" />

    <!--
      Vista previa al compartir el link (WhatsApp, Instagram, Facebook, X).
      Las URLs tienen que ser absolutas: si cambia el dominio, actualizarlas acá
      y en publicUrl (src/app/core/config/site.config.ts).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Il Gatto Nero" />
    <meta property="og:title" content="Il Gatto Nero · Menú" />
    <meta
      property="og:description"
      content="Pizzeria · Cucina Italiana. Mirá nuestra carta: pizzas, pastas artesanales, dolci, cocktails y vinos."
    />
    <meta property="og:url" content="https://il-gatto-nero-sooty.vercel.app/" />
    <meta property="og:image" content="https://il-gatto-nero-sooty.vercel.app/images/Logo.jpg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Logo de Il Gatto Nero" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Il Gatto Nero · Menú" />
    <meta name="twitter:image" content="https://il-gatto-nero-sooty.vercel.app/images/Logo.jpg" />
    <link rel="canonical" href="https://il-gatto-nero-sooty.vercel.app/" />

    <!-- Íconos circulares (círculo negro con el logo en blanco), generados desde images/Logo.jpg -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <!-- iOS no admite transparencia: este es cuadrado y el sistema le redondea las esquinas -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <!--
      Mientras carga Angular se ve la pantalla en negro, igual que la cortina de la intro
      (Angular reemplaza este bloque al arrancar): así no hay destellos al recargar.
    -->
    <app-root><div style="position: fixed; inset: 0; background: #0d0d0d"></div></app-root>
  </body>
</html>
