<header class="menu-header">
  <span class="menu-header__curtain" aria-hidden="true"></span>
  <app-thin-frame class="menu-header__frame" />

  <div class="menu-header__content">
    <h1 class="menu-header__brand">
      <img
        class="menu-header__logo logo-on-light"
        [src]="logoUrl"
        [alt]="name()"
        width="1080"
        height="1080"
        fetchpriority="high"
      />
    </h1>

    <p class="menu-header__tagline">
      <span class="visually-hidden">{{ tagline }}</span>
      @for (letter of taglineLetters; track $index) {
        <span class="menu-header__letter" aria-hidden="true" [style.--letter-index]="$index">{{
          letter
        }}</span>
      }
    </p>

    <span class="menu-header__rule" aria-hidden="true"></span>
    <p class="menu-header__eyebrow">Il Menù</p>
  </div>

  <span class="menu-header__scroll-cue" aria-hidden="true"></span>
</header>
