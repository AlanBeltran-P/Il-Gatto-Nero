<label class="search">
  <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4" />
    <path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" />
  </svg>
  <span class="visually-hidden">Buscar en el menú</span>
  <input
    class="search__input"
    type="search"
    placeholder="Buscar un plato, vino o cocktail"
    autocomplete="off"
    enterkeyhint="search"
    [value]="query()"
    (input)="onInput($event)"
  />
  @if (query()) {
    <button type="button" class="search__clear" aria-label="Borrar búsqueda" (click)="clear()">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
    </button>
  }
</label>
